<svg width="680" height="520" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Pipeline Replacement Tracking — GIS Workflow</title>
  <desc>Flujo completo de trabajo: intake de datos CAD y formularios, validación espacial, validación de atributos, GIS ABM y comparativa plan vs ejecución</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="520" fill="#111827" rx="8"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="680" height="36" fill="#0d1520" rx="8"/>
  <rect x="0" y="26" width="680" height="10" fill="#0d1520"/>
  <text x="340" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#a0b0c0" font-weight="bold">Pipeline Replacement Tracking — GIS Workflow</text>

  <!-- STAGE 1 - DATA INTAKE -->
  <rect x="20" y="55" width="115" height="380" fill="#1e3a5f" stroke="#2e5a9f" stroke-width="0.5" rx="6"/>
  <text x="77" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#5dade2" font-weight="bold">STAGE 1</text>
  <text x="77" y="87" text-anchor="middle" font-family="monospace" font-size="8" fill="#8ab0d0">DATA INTAKE</text>
  <rect x="30" y="100" width="95" height="28" fill="#2e5a9f" rx="4"/>
  <text x="77" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff" font-weight="bold">Contractor</text>
  <rect x="30" y="140" width="40" height="24" fill="#1a3a5f" stroke="#5dade2" stroke-width="0.5" rx="3"/>
  <text x="50" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="#5dade2">CAD</text>
  <rect x="75" y="140" width="40" height="24" fill="#1a3a5f" stroke="#5dade2" stroke-width="0.5" rx="3"/>
  <text x="95" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="#5dade2">Form</text>
  <rect x="30" y="176" width="95" height="20" fill="#142a44" stroke="#e67e22" stroke-width="0.5" rx="3"/>
  <text x="77" y="190" text-anchor="middle" font-family="monospace" font-size="7" fill="#e67e22">1 CAD + 1 Form / pipeline</text>
  <rect x="30" y="208" width="95" height="20" fill="#142a44" stroke="#4a6a8a" stroke-width="0.5" rx="3"/>
  <text x="77" y="221" text-anchor="middle" font-family="monospace" font-size="8" fill="#8ab0d0">Log intake</text>

  <!-- Arrow S1 → S2 -->
  <line x1="135" y1="245" x2="155" y2="245" stroke="#4a8abf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STAGE 2 - CAD VALIDATION -->
  <rect x="155" y="55" width="115" height="380" fill="#3d2a10" stroke="#9f6a1a" stroke-width="0.5" rx="6"/>
  <text x="212" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#e67e22" font-weight="bold">STAGE 2</text>
  <text x="212" y="87" text-anchor="middle" font-family="monospace" font-size="8" fill="#b08030">CAD VALIDATION</text>
  <rect x="165" y="100" width="95" height="20" fill="#5a3a10" stroke="#e67e22" stroke-width="0.5" rx="3"/>
  <text x="212" y="114" text-anchor="middle" font-family="monospace" font-size="7" fill="#e67e22">EP1 displacement</text>
  <rect x="165" y="125" width="95" height="20" fill="#5a3a10" stroke="#e67e22" stroke-width="0.5" rx="3"/>
  <text x="212" y="139" text-anchor="middle" font-family="monospace" font-size="7" fill="#e67e22">EP2 displacement</text>
  <rect x="165" y="150" width="95" height="14" fill="#3a2208" rx="2"/>
  <text x="212" y="161" text-anchor="middle" font-family="monospace" font-size="8" fill="#f39c12">tolerance &lt;= 5 m</text>
  <rect x="165" y="172" width="95" height="20" fill="#5a3a10" stroke="#d68a18" stroke-width="0.5" rx="3"/>
  <text x="212" y="186" text-anchor="middle" font-family="monospace" font-size="7" fill="#d68a18">Trace geometry</text>
  <rect x="165" y="198" width="95" height="20" fill="#5a3a10" stroke="#d68a18" stroke-width="0.5" rx="3"/>
  <text x="212" y="212" text-anchor="middle" font-family="monospace" font-size="7" fill="#d68a18">Layout elements</text>
  <rect x="165" y="224" width="95" height="20" fill="#5a3a10" stroke="#d68a18" stroke-width="0.5" rx="3"/>
  <text x="212" y="238" text-anchor="middle" font-family="monospace" font-size="7" fill="#d68a18">Nomenclature</text>

  <!-- Arrow S2 → S3 -->
  <line x1="270" y1="245" x2="290" y2="245" stroke="#4a8abf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STAGE 3 - FORM VALIDATION -->
  <rect x="290" y="55" width="115" height="380" fill="#0f3020" stroke="#1a7a3a" stroke-width="0.5" rx="6"/>
  <text x="347" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60" font-weight="bold">STAGE 3</text>
  <text x="347" y="87" text-anchor="middle" font-family="monospace" font-size="7" fill="#508a60">FORM VALIDATION</text>
  <rect x="300" y="100" width="95" height="20" fill="#1a5a30" stroke="#27ae60" stroke-width="0.5" rx="3"/>
  <text x="347" y="114" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">OMEGA = YES</text>
  <rect x="300" y="125" width="95" height="20" fill="#1a5a30" stroke="#27ae60" stroke-width="0.5" rx="3"/>
  <text x="347" y="139" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">Survey date</text>
  <rect x="300" y="150" width="95" height="20" fill="#1a5a30" stroke="#27ae60" stroke-width="0.5" rx="3"/>
  <text x="347" y="164" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">Data origin</text>
  <rect x="300" y="175" width="95" height="20" fill="#1a5a30" stroke="#27ae60" stroke-width="0.5" rx="3"/>
  <text x="347" y="189" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">Endpoint IDs</text>
  <rect x="300" y="200" width="95" height="20" fill="#1a5a30" stroke="#27ae60" stroke-width="0.5" rx="3"/>
  <text x="347" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">Pipeline status</text>

  <!-- Arrow S3 → Decision -->
  <line x1="405" y1="245" x2="425" y2="245" stroke="#4a8abf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DECISION DIAMOND -->
  <polygon points="455,220 490,245 455,270 420,245" fill="#1e4d78" stroke="#5dade2" stroke-width="1"/>
  <text x="455" y="241" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff" font-weight="bold">OK?</text>

  <!-- Arrow NO → Return box -->
  <line x1="455" y1="270" x2="455" y2="320" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="300" font-family="monospace" font-size="8" fill="#e74c3c">NO</text>
  <rect x="395" y="320" width="120" height="36" fill="#3a0a0a" stroke="#e74c3c" stroke-width="0.5" rx="4"/>
  <text x="455" y="336" text-anchor="middle" font-family="monospace" font-size="8" fill="#e74c3c" font-weight="bold">Return to</text>
  <text x="455" y="348" text-anchor="middle" font-family="monospace" font-size="8" fill="#e74c3c">contractor</text>
  <!-- Dashed return arrow -->
  <path d="M395 338 Q200 400 77 380 L77 440" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="415" text-anchor="middle" font-family="monospace" font-size="7" fill="#e74c3c">corrected redelivery</text>
  <rect x="27" y="440" width="100" height="20" fill="#2a0808" stroke="#e74c3c" stroke-width="0.5" rx="3"/>
  <text x="77" y="454" text-anchor="middle" font-family="monospace" font-size="8" fill="#e74c3c">new delivery</text>

  <!-- Arrow YES → S4 -->
  <line x1="490" y1="245" x2="510" y2="245" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="238" font-family="monospace" font-size="8" fill="#27ae60">YES</text>

  <!-- STAGE 4 - GIS ABM -->
  <rect x="510" y="55" width="115" height="240" fill="#2a1a4a" stroke="#7a3abf" stroke-width="0.5" rx="6"/>
  <text x="567" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#9b59b6" font-weight="bold">STAGE 4</text>
  <text x="567" y="87" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a5090">GIS ABM UPDATE</text>
  <rect x="520" y="100" width="95" height="28" fill="#1e4a2a" stroke="#27ae60" stroke-width="0.5" rx="3"/>
  <text x="567" y="112" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60" font-weight="bold">Alta</text>
  <text x="567" y="123" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">Load new trace</text>
  <rect x="520" y="135" width="95" height="28" fill="#3a0a0a" stroke="#e74c3c" stroke-width="0.5" rx="3"/>
  <text x="567" y="147" text-anchor="middle" font-family="monospace" font-size="7" fill="#e74c3c" font-weight="bold">Baja</text>
  <text x="567" y="158" text-anchor="middle" font-family="monospace" font-size="7" fill="#e74c3c">Retire original</text>
  <rect x="520" y="170" width="95" height="28" fill="#3a3000" stroke="#f1c40f" stroke-width="0.5" rx="3"/>
  <text x="567" y="182" text-anchor="middle" font-family="monospace" font-size="7" fill="#f1c40f" font-weight="bold">Mod</text>
  <text x="567" y="193" text-anchor="middle" font-family="monospace" font-size="7" fill="#f1c40f">Update attrs</text>
  <rect x="520" y="210" width="95" height="20" fill="#1a1a2a" stroke="#6a4a9a" stroke-width="0.5" rx="3"/>
  <text x="567" y="224" text-anchor="middle" font-family="monospace" font-size="7" fill="#9b59b6">Log in control table</text>

  <!-- Arrow S4 → S5 -->
  <line x1="567" y1="295" x2="567" y2="330" stroke="#4a8abf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STAGE 5 - PLAN vs EXECUTION -->
  <rect x="510" y="330" width="150" height="110" fill="#3a1010" stroke="#9f1a1a" stroke-width="0.5" rx="6"/>
  <text x="585" y="350" text-anchor="middle" font-family="monospace" font-size="8" fill="#e74c3c" font-weight="bold">STAGE 5</text>
  <text x="585" y="362" text-anchor="middle" font-family="monospace" font-size="7" fill="#9f5a5a">PLAN vs EXECUTION</text>
  <rect x="520" y="370" width="130" height="20" fill="#2a0808" stroke="#c0392b" stroke-width="0.5" rx="3"/>
  <text x="585" y="384" text-anchor="middle" font-family="monospace" font-size="7" fill="#e74c3c">Master plan vs GIS control</text>
  <rect x="520" y="396" width="58" height="16" fill="#0a2a0a" stroke="#27ae60" stroke-width="0.5" rx="2"/>
  <text x="549" y="408" text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60">Delivered</text>
  <rect x="582" y="396" width="58" height="16" fill="#2a2a00" stroke="#f1c40f" stroke-width="0.5" rx="2"/>
  <text x="611" y="408" text-anchor="middle" font-family="monospace" font-size="7" fill="#f1c40f">Pending</text>
  <rect x="520" y="416" width="58" height="16" fill="#00102a" stroke="#5dade2" stroke-width="0.5" rx="2"/>
  <text x="549" y="428" text-anchor="middle" font-family="monospace" font-size="7" fill="#5dade2">In review</text>
  <rect x="582" y="416" width="58" height="16" fill="#2a0808" stroke="#e74c3c" stroke-width="0.5" rx="2"/>
  <text x="611" y="428" text-anchor="middle" font-family="monospace" font-size="7" fill="#e74c3c">Rejected</text>

  <!-- Bottom status bar -->
  <rect x="0" y="490" width="680" height="30" fill="#0d1520"/>
  <text x="20" y="510" font-family="monospace" font-size="9" fill="#27ae60">● Status: Active</text>
  <text x="150" y="510" font-family="monospace" font-size="9" fill="#8a9bb0">Max EP displacement: 5m</text>
  <text x="380" y="510" font-family="monospace" font-size="9" fill="#8a9bb0">compare_replacement_plan.py</text>
  <text x="570" y="510" font-family="monospace" font-size="9" fill="#5dade2">ArcGIS Pro</text>
</svg>
